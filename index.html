const API='https://script.google.com/macros/s/AKfycbzumoikKGJePSgX7t2Ov8y4zrwuUw3vxkU5mxWn_MgUBqsCw-E-HE0ZPN5_Rehyd3Bb/exec';

async function apiGet(action,params={}){
  try{
    const qs=new URLSearchParams({action,...params});
    const res=await fetch(API+'?'+qs.toString());
    return await res.json();
  }catch(e){return{success:false,message:e.message};}
}

async function apiPost(action,payload={}){
  try{
    const res=await fetch(API,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action,payload})
    });
    return await res.json();
  }catch(e){return{success:false,message:e.message};}
}

const TRAINEE_AUTH_KEY = 'tr_auth_v1';
const TRAINEE_AUTH_MS  = 8*60*60*1000;

function isTraineeAuthed(){
  try{const d=JSON.parse(localStorage.getItem(TRAINEE_AUTH_KEY)||'{}');return !!(d.ts&&(Date.now()-d.ts)<TRAINEE_AUTH_MS);}catch(e){return false;}
}

async function unlockTrainee(){
  localStorage.setItem(TRAINEE_AUTH_KEY,JSON.stringify({ts:Date.now()}));
  closeModal('traineeAuthModal');
  document.getElementById('trainee-auth-pw').value='';
  document.getElementById('trainee-auth-msg').textContent='';

}

function submitTraineeAuth(){
  const pw=(document.getElementById('trainee-auth-pw').value||'').trim();
  const msg=document.getElementById('trainee-auth-msg');
  const btn=document.getElementById('trainee-auth-btn');
  if(btn.disabled)return;
  if(pw===TRAINEE_PW){unlockTrainee();}
  else{
    window._authFail=(window._authFail||0)+1;
    document.getElementById('trainee-auth-pw').value='';
    if(window._authFail>=3){
      btn.disabled=true;document.getElementById('trainee-auth-pw').disabled=true;
      msg.textContent='⛔ 3회 연속 실패 · 10초 후 재시도 가능합니다.';
      let sec=10;const ti=setInterval(()=>{sec--;msg.textContent=`⛔ ${sec}초 후 재시도 가능합니다.`;if(sec<=0){clearInterval(ti);btn.disabled=false;document.getElementById('trainee-auth-pw').disabled=false;window._authFail=0;msg.textContent='';}},1000);
    }else{msg.textContent=`⚠ 비밀번호가 올바르지 않습니다. (${window._authFail}/3)`;}
  }
}

function cancelTraineeAuth(){closeModal('traineeAuthModal');document.getElementById('trainee-auth-pw').value='';document.getElementById('trainee-auth-msg').textContent='';}

function fmtDate(d){if(!d)return'';const dt=new Date(d);if(isNaN(dt))return d;const yy=String(dt.getFullYear()).slice(2);const mm=String(dt.getMonth()+1).padStart(2,'0');const dd=String(dt.getDate()).padStart(2,'0');return`${yy}.${mm}.${dd}`;}
function weeksBetween(a,b){if(!a||!b)return 0;return Math.round((new Date(b)-new Date(a))/(7*86400000));}
function calcGradDay(graddt){if(!graddt)return null;const g=new Date(graddt);if(isNaN(g))return null;return Math.round((g-TODAY)/86400000);}
function trafficLight(rate,gradDay){if(gradDay!==null&&gradDay<0)return{cls:'traffic-red',dot:'dot-red',label:'지연'};if(rate>=70)return{cls:'traffic-green',dot:'dot-green',label:'정상'};if(rate>=40)return{cls:'traffic-yellow',dot:'dot-yellow',label:'주의'};return{cls:'traffic-red',dot:'dot-red',label:'지연'};}
function showToast(msg,type='info'){const t=document.getElementById('toast');t.textContent=msg;t.style.background=type==='error'?'#dc2626':type==='success'?'#059669':'#1e3a5f';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function downloadCSV(content,filename){const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(content);a.download=filename;a.click();}
function batchSortKey(s){const m=(s||'').match(/(\d+)-(\d+)/);return m?[parseInt(m[1]),parseInt(m[2])]:[9999,9999];}

function renderCourseTagSmall(courseStr){if(!courseStr)return'<span class="badge badge-gray">-</span>';return courseStr.split(',').map(c=>{c=c.trim();const cls=c==='G/S'?'tag-gs':c==='FTD'?'tag-ftd':c==='SIM'?'tag-sim':c==='비행'?'tag-fly':c==='교육대기'?'tag-wait':'badge-gray';return`<span class="tag-btn ${cls}" style="cursor:default;margin:1px;padding:1px 7px;font-size:10px">${c}</span>`;}).join('');}
function rateBar(rate){const clr=rate>=70?'#10b981':rate>=40?'#f59e0b':'#ef4444';return`<div style="display:flex;align-items:center;gap:6px"><div class="prog-bar-wrap" style="flex:1"><div class="prog-bar-fill" style="width:${Math.min(rate,100)}%;background:${clr}"></div></div><span style="font-size:11px;font-weight:700;color:${clr};min-width:36px">${rate.toFixed(1)}%</span></div>`;}
function gradDayHtml(day){if(day===null)return'<span class="badge badge-gray">-</span>';if(day<0)return`<span class="badge badge-red">D+${Math.abs(day)}</span>`;if(day===0)return'<span class="badge badge-green">D-Day</span>';return`<span class="badge badge-blue">D-${day}</span>`;}
function renderProgressTable(){

  let pg='';if(maxPg>1){pg+=`<button class="btn btn-gray btn-sm" onclick="trPage=1;renderTrainees()">«</button><button class="btn btn-gray btn-sm" onclick="if(trPage>1){trPage--;renderTrainees()}">‹</button>`;for(let p=Math.max(1,trPage-2);p<=Math.min(maxPg,trPage+2);p++){pg+=`<button class="btn btn-sm ${p===trPage?'btn-primary':'btn-outline'}" onclick="trPage=${p};renderTrainees()">${p}</button>`;}pg+=`<button class="btn btn-gray btn-sm" onclick="if(trPage<${maxPg}){trPage++;renderTrainees()}">›</button><button class="btn btn-gray btn-sm" onclick="trPage=${maxPg};renderTrainees()">»</button><span class="text-muted" style="font-size:11px">${trPage}/${maxPg} 페이지 (${total}명)</span>`;}
  document.getElementById('tr-paging').innerHTML=pg;
}

async function delTrItem(idx){

async function handleKauUpload(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async function(evt){
    try{
      const wb=XLSX.read(evt.target.result,{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:0});
      if(!rows.length){showToast('⚠ 데이터가 없습니다','error');return;}
      let added=0,updated=0,skipped=0;
      rows.forEach(r=>{const yr=nz(r['연도']||r['년도']||r['YEAR']||0);if(!yr){skipped++;return;}const item={yr,inAb:nz(r['입교AB']||0),inMil:nz(r['입교군경력']||r['군경력']||0),inCiv:nz(r['입교민경력']||r['민경력']||0),inApp:nz(r['입교APP']||r['APP']||0),inLj:nz(r['입교LJ']||r['LJ']||0),inOz:nz(r['입교OZ']||r['OZ']||0),grAb:nz(r['수료AB']||0),grMil:nz(r['수료군경력']||0),grCiv:nz(r['수료민경력']||0),grApp:nz(r['수료APP']||0),grLj:nz(r['수료LJ']||0),grOz:nz(r['수료OZ']||0),drop:nz(r['퇴교']||0)};const existIdx=kauData.findIndex(d=>d.yr===yr);if(existIdx>=0){kauData[existIdx]=item;updated++;}else{kauData.push(item);added++;}});
      showToast(`⏳ ${added+updated}건 Sheets 저장 중...`,'info');
      await apiPost('kau.upload',{rows:kauData});
      saveLS(LS.KAU,kauData);renderKau();showToast(`✅ 추가 ${added}건, 업데이트 ${updated}건 완료${skipped?` (${skipped}건 스킵)`:''}`,'success');
    }catch(err){showToast('⚠ 파일 오류: '+err.message,'error');}
  };
  reader.readAsArrayBuffer(file);e.target.value='';
}

  document.getElementById('total-stat-wrap').innerHTML=`<div class="info-bar mb-3" style="font-size:11.5px">※ KE Ab-initio 수치는 직접 입력 가능합니다. 입력 후 <strong>[검증 계산]</strong> 버튼을 클릭하세요.<br>※ 현재원은 <strong>KE 양성현황 총인원</strong> 합계로 자동 집계됩니다.</div><table class="data-table" style="max-width:980px"><thead><tr><th>구분</th><th>입교인원</th><th>수료인원</th><th>퇴교</th><th>현재원<br><span style="font-size:10px;font-weight:400">(KE양성현황 총인원)</span></th><th>휴학/대기</th><th>검증 (입교 = 수료+퇴교+현재+대기)</th></tr></thead><tbody><tr><td style="font-weight:700">KE Ab-initio<br><span style="font-size:10px;color:var(--muted)">(직접입력)</span></td><td><input class="stat-input" id="stat-keAbIn" value="${totalStat.keAbIn}" type="number" onchange="saveStatInput()"></td><td><input class="stat-input" id="stat-keAbGr" value="${totalStat.keAbGr}" type="number" onchange="saveStatInput()"></td><td><input class="stat-input" id="stat-keAbDr" value="${totalStat.keAbDr}" type="number" onchange="saveStatInput()"></td><td>-</td><td>-</td><td>-</td></tr><tr><td style="font-weight:700">KAU 정석훈련원<br><span style="font-size:10px;color:var(--muted)">(자동집계)</span></td><td>${kauIn.toLocaleString()}</td><td>${kauGr.toLocaleString()}</td><td>${kauDr}</td><td>-</td><td>-</td><td>-</td></tr><tr id="total-stat-sum-row"><td style="font-weight:700">KAU + KE 합계</td><td id="s-totIn">-</td><td id="s-totGr">-</td><td id="s-totDr">-</td><td id="s-curN" style="font-weight:700;color:var(--primary)">${curN}<div style="font-size:10px;color:var(--muted);font-weight:400">KE양성현황 기준</div></td><td><input class="stat-input" id="stat-holdN" value="${totalStat.holdN||0}" type="number" onchange="saveStatInput()"></td><td id="s-chk">-</td></tr></tbody></table><div class="toolbar mt-2 no-print"><button class="btn btn-primary btn-sm" onclick="calcTotalStat()">🔢 검증 계산</button><button class="btn btn-gray btn-sm" onclick="saveStatInput();showToast('💾 저장 완료','success')">💾 저장</button></div>`;
  calcTotalStat();
}
function saveStatInput(){totalStat.keAbIn=nz(document.getElementById('stat-keAbIn')?.value);totalStat.keAbGr=nz(document.getElementById('stat-keAbGr')?.value);totalStat.keAbDr=nz(document.getElementById('stat-keAbDr')?.value);totalStat.holdN=nz(document.getElementById('stat-holdN')?.value);saveLS(LS.TOTALSTAT,totalStat);}
function calcTotalStat(){saveStatInput();const keAbIn=nz(document.getElementById('stat-keAbIn')?.value)||totalStat.keAbIn,keAbGr=nz(document.getElementById('stat-keAbGr')?.value)||totalStat.keAbGr,keAbDr=nz(document.getElementById('stat-keAbDr')?.value)||totalStat.keAbDr,holdN=nz(document.getElementById('stat-holdN')?.value)||totalStat.holdN||0,kauIn=kauData.reduce((s,d)=>s+nz(d.inAb)+nz(d.inMil)+nz(d.inCiv)+nz(d.inApp)+nz(d.inLj)+nz(d.inOz),0),kauGr=kauData.reduce((s,d)=>s+nz(d.grAb)+nz(d.grMil)+nz(d.grCiv)+nz(d.grApp)+nz(d.grLj)+nz(d.grOz),0),kauDr=kauData.reduce((s,d)=>s+nz(d.drop),0),curN=keData.reduce((s,d)=>s+nz(d.total),0),totIn=kauIn+keAbIn,totGr=kauGr+keAbGr,totDr=kauDr+keAbDr,chk=totIn===(totGr+totDr+curN+holdN);const si=document.getElementById('s-totIn');if(si){document.getElementById('s-totIn').textContent=totIn.toLocaleString();document.getElementById('s-totGr').textContent=totGr.toLocaleString();document.getElementById('s-totDr').textContent=totDr;document.getElementById('s-curN').innerHTML=`<span style="font-weight:700;color:var(--primary)">${curN}</span><div style="font-size:10px;color:var(--muted);font-weight:400">KE양성현황 기준</div>`;document.getElementById('s-chk').innerHTML=`<span class="${chk?'true-badge':'false-badge'}">${chk?'✅ TRUE':'❌ FALSE'}</span><span style="font-size:10px;margin-left:8px">(${totIn.toLocaleString()} = ${totGr.toLocaleString()} + ${totDr} + ${curN} + ${holdN} = ${(totGr+totDr+curN+holdN).toLocaleString()})</span>`;}}
function renderAnalyticsCharts(){const sorted=[...kauData].sort((a,b)=>a.yr-b.yr),labels=sorted.map(d=>d.yr+'년'),inArr=sorted.map(d=>nz(d.inAb)+nz(d.inMil)+nz(d.inCiv)+nz(d.inApp)+nz(d.inLj)+nz(d.inOz)),grArr=sorted.map(d=>nz(d.grAb)+nz(d.grMil)+nz(d.grCiv)+nz(d.grApp)+nz(d.grLj)+nz(d.grOz));if(chartReg['analytics-yearly'])chartReg['analytics-yearly'].destroy();chartReg['analytics-yearly']=new Chart(document.getElementById('chart-analytics-yearly'),{type:'bar',data:{labels,datasets:[{label:'입교',data:inArr,backgroundColor:'rgba(30,64,175,.82)',borderRadius:3},{label:'수료',data:grArr,backgroundColor:'rgba(16,185,129,.82)',borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top'},datalabels:{anchor:'end',align:'top',color:'#1e3a5f',font:{weight:'bold',size:10},formatter:v=>v>0?v:''}},scales:{y:{beginAtZero:true}}}});const tMil=sorted.reduce((s,d)=>s+nz(d.inMil),0),tCiv=sorted.reduce((s,d)=>s+nz(d.inCiv),0),tApp=sorted.reduce((s,d)=>s+nz(d.inApp),0),tAb=sorted.reduce((s,d)=>s+nz(d.inAb),0),tLj=sorted.reduce((s,d)=>s+nz(d.inLj),0),tOz=sorted.reduce((s,d)=>s+nz(d.inOz),0),originTotal=tMil+tCiv+tApp+tAb+tLj+tOz;if(chartReg['analytics-origin'])chartReg['analytics-origin'].destroy();chartReg['analytics-origin']=new Chart(document.getElementById('chart-analytics-origin'),{type:'pie',data:{labels:['KE 군경력','KE 민경력','KE APP','KE AB','LJ','OZ'],datasets:[{data:[tMil,tCiv,tApp,tAb,tLj,tOz],backgroundColor:['#1e40af','#3b82f6','#60a5fa','#93c5fd','#f59e0b','#10b981']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'},datalabels:{color:'#fff',font:{weight:'bold',size:11},formatter:(v,ctx)=>{if(v===0)return'';const pct=((v/originTotal)*100).toFixed(1);return`${v}명\n(${pct}%)`;}}}}});const keTotal=tMil+tCiv+tApp+tAb,airTotal=keTotal+tLj+tOz;if(chartReg['analytics-airline'])chartReg['analytics-airline'].destroy();chartReg['analytics-airline']=new Chart(document.getElementById('chart-analytics-airline'),{type:'doughnut',data:{labels:['KE','LJ','OZ'],datasets:[{data:[keTotal,tLj,tOz],backgroundColor:['#1e40af','#f59e0b','#10b981']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'},datalabels:{color:'#fff',font:{weight:'bold',size:12},formatter:(v,ctx)=>{if(v===0)return'';const pct=((v/airTotal)*100).toFixed(1);return`${v}명\n${pct}%`;}},tooltip:{callbacks:{label:ctx=>{const tot=ctx.dataset.data.reduce((a,b)=>a+b,0);return` ${ctx.label}: ${ctx.raw}명 (${((ctx.raw/tot)*100).toFixed(1)}%)`;}}}}}});if(chartReg['analytics-stack'])chartReg['analytics-stack'].destroy();chartReg['analytics-stack']=new Chart(document.getElementById('chart-analytics-stack'),{type:'bar',data:{labels,datasets:[{label:'KE 군경력',data:sorted.map(d=>nz(d.inMil)),backgroundColor:'#1e3a5f'},{label:'KE 민경력',data:sorted.map(d=>nz(d.inCiv)),backgroundColor:'#1e40af'},{label:'KE APP',data:sorted.map(d=>nz(d.inApp)),backgroundColor:'#3b82f6'},{label:'KE AB',data:sorted.map(d=>nz(d.inAb)),backgroundColor:'#93c5fd'},{label:'LJ',data:sorted.map(d=>nz(d.inLj)),backgroundColor:'#f59e0b'},{label:'OZ',data:sorted.map(d=>nz(d.inOz)),backgroundColor:'#10b981'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top'},datalabels:{display:false}},scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true}}}});if(chartReg['analytics-trend'])chartReg['analytics-trend'].destroy();chartReg['analytics-trend']=new Chart(document.getElementById('chart-analytics-trend'),{type:'line',data:{labels,datasets:[{label:'입교',data:inArr,borderColor:'#1e40af',backgroundColor:'rgba(30,64,175,.1)',fill:true,tension:.35,pointRadius:4},{label:'수료',data:grArr,borderColor:'#10b981',backgroundColor:'rgba(16,185,129,.1)',fill:true,tension:.35,pointRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top'},datalabels:{display:false}},scales:{y:{beginAtZero:true}}}});}
function render2026Detail(){const sc26=scData.filter(s=>s.yr===2026).sort((a,b)=>a.batch.localeCompare(b.batch));if(!sc26.length){document.getElementById('analytics-2026-detail').innerHTML='<p class="text-muted text-center" style="padding:20px">2026년도 교육일정 데이터 없음</p>';return;}let tMil=0,tCiv=0,tApp=0,tLj=0,tOz=0,tAll=0;const rows=sc26.map(s=>{tMil+=nz(s.keMil);tCiv+=nz(s.keCiv);tApp+=nz(s.keApp);tLj+=nz(s.lj);tOz+=nz(s.oz);tAll+=nz(s.total);const course=s.keApp>0?'군+민+APP 혼합':(s.keMil>0&&s.keCiv>0)?'군+민 혼합':s.keMil>0?'군경력':s.keCiv>0?'민경력':'혼합';const sb=s.status==='완료'?'badge-green':s.status==='교육중'?'badge-blue':'badge-yellow';return`<tr><td>${s.batch}</td><td>${fmtDate(s.enter)}</td><td>${fmtDate(s.flyE)||'-'}</td><td>${course}</td><td>${nz(s.keMil)||''}</td><td>${nz(s.keCiv)||''}</td><td>${nz(s.keApp)||''}</td><td>${nz(s.lj)||''}</td><td>${nz(s.oz)||''}</td><td style="font-weight:700">${nz(s.total)}</td><td>${nz(s.weeks)}주</td><td><span class="badge ${sb}">${s.status}</span></td></tr>`;}).join('');document.getElementById('analytics-2026-detail').innerHTML=`<table class="data-table"><thead><tr><th>차수</th><th>입과일</th><th>수료(예정)일</th><th>교육과정</th><th>군경력</th><th>민경력</th><th>APP</th><th>LJ</th><th>OZ</th><th>총인원</th><th>교육기간</th><th>상태</th></tr></thead><tbody>${rows}</tbody><tfoot><tr class="total-row"><td colspan="4">합계 (${sc26.length}차수)</td><td>${tMil}</td><td>${tCiv}</td><td>${tApp}</td><td>${tLj}</td><td>${tOz}</td><td>${tAll}</td><td></td><td></td></tr></tfoot></table>`;}
